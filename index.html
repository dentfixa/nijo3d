<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const MOBILE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const V3 = THREE.Vector3;
const lprog = document.getElementById('lprog');
const tick = (msg)=>{ if(lprog) lprog.textContent = msg; return new Promise(r=>setTimeout(r,0)); };

// ---------- utils ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261114);
const rnd = mulberry32(777);
const R = (a,b)=>a+(b-a)*rand();
function hash2(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s/(1-Math.pow(.5,o));}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const srgb=(r,g,b)=>new THREE.Color().setRGB(r,g,b,THREE.SRGBColorSpace);
const s255=(r,g,b)=>srgb(r/255,g/255,b/255);
const hex=(h)=>new THREE.Color(h);
const ni=g=>g.index?g.toNonIndexed():g;

// ---------- renderer & output format ----------
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', preserveDrawingBuffer:CAPTURE});
const DPR = CAPTURE ? 1 : Math.min(devicePixelRatio, MOBILE ? 1.25 : 1.75);
renderer.setPixelRatio(DPR);
let W = CAPTURE ? (+params.get('w')||1280) : innerWidth, H = CAPTURE ? (+params.get('h')||720) : innerHeight;
renderer.setSize(W,H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);
const gl = renderer.getContext();
const OUT = {p3:false, f16:false};
function configureOutput(){
  const p3q = params.get('p3');
  const wantP3 = p3q==='1' || (p3q!=='0' && matchMedia('(color-gamut: p3)').matches);
  try{ if(wantP3 && 'drawingBufferColorSpace' in gl) gl.drawingBufferColorSpace='display-p3'; OUT.p3 = gl.drawingBufferColorSpace==='display-p3'; }catch(e){ OUT.p3=false; }
  OUT.f16=false;
  if(params.get('f16')!=='0' && typeof gl.drawingBufferStorage==='function'){
    try{ gl.drawingBufferStorage(gl.RGBA16F, gl.canvas.width, gl.canvas.height); OUT.f16 = gl.drawingBufferFormat===gl.RGBA16F; }catch(e){ OUT.f16=false; }
  }
}
configureOutput();
const badge=document.getElementById('badge');
const STATS={tris:0,calls:0,buildings:0,roads:0,trees:0};
function updateBadge(){
  const hdr = matchMedia('(dynamic-range: high)').matches;
  const bpc = Math.round((screen.colorDepth||24)/3);
  badge.innerHTML = `내부 렌더링: <b>16비트 부동소수 HDR</b> (RGBA16F)<br>`+
    `출력 캔버스: <b>${OUT.f16?'16비트 float':'8비트'}</b> · <b>${OUT.p3?'Display-P3':'sRGB'}</b> · 디더링<br>`+
    `모니터 보고값: ${bpc}비트/채널${hdr?' · HDR 지원':''}<br>`+
    `OSM 건물 <b>${STATS.buildings.toLocaleString()}</b>동 · 도로 ${STATS.roads.toLocaleString()}개 · 나무 ${STATS.trees.toLocaleString()}그루`;
}
updateBadge();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W/H, 1, 30000);
// world axes: +x = east, -z = north, y = up (metres, origin = Nijo-jo centre)
const HOME_POS = new V3(1350, 1050, 1750), HOME_TGT = new V3(-60, 0, 40);
const CASTLE_POS = new V3(520, 95, 330), CASTLE_TGT = new V3(160, 8, 20);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.maxPolarAngle = Math.PI*0.495; controls.minPolarAngle = 0.06; controls.minDistance = 12; controls.maxDistance = 6000;
controls.screenSpacePanning = false; controls.zoomToCursor = true;
controls.update();

// ---------- texture helpers ----------
function canvasTex(w,h,draw,{srgb:s=true,repeat,aniso=8}={}){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);if(s)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=aniso;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat);}return t;}
const rgb=(r,g,b,a)=>a===undefined?`rgb(${r|0},${g|0},${b|0})`:`rgba(${r|0},${g|0},${b|0},${a})`;

// ---------- facade / roof atlas (4x4 tiles, 512px each, RGB = albedo, A = glass mask) ----------
// module size of each tile in metres [width, height]
const TILE = {MACHIYA:0,HOUSE:1,HOUSE2:2,APART:3,OFFICE_GLASS:4,OFFICE_TILE:5,CONCRETE:6,PLASTER:7,KAWARA:8,ROOF_FLAT:9,ROOF_METAL:10,ISHIGAKI:11,SCHOOL:12,TEMPLE:13,SHOP:14,MACHIYA_UP:15};
const MOD = [[3.6,3.0],[4.0,2.9],[4.0,2.9],[3.6,2.9],[3.2,3.8],[3.2,3.5],[4.0,3.0],[4.0,3.6],[2.4,2.4],[8,8],[3,3],[4.0,2.4],[4.0,3.6],[4.0,3.6],[4.5,3.4],[3.6,2.6]];
const ATL=2048, TS=512;
function buildAtlas(){
  const c=document.createElement('canvas');c.width=c.height=ATL;const g=c.getContext('2d');
  const cm=document.createElement('canvas');cm.width=cm.height=ATL;const gm=cm.getContext('2d');
  gm.fillStyle='#000';gm.fillRect(0,0,ATL,ATL);
  const r=mulberry32(4242);
  const draw=[];
  // helpers in metre space (y measured from tile bottom, up)
  const T=(i,fn)=>draw[i]=fn;
  function tileCtx(i){const tx=(i%4)*TS,ty=Math.floor(i/4)*TS,[mw,mh]=MOD[i];const sx=TS/mw,sy=TS/mh;
    const R_=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(tx+x*sx,ty+TS-(y+h)*sy,w*sx,h*sy);};
    const G_=(x,y,w,h,a=1)=>{gm.fillStyle=`rgb(${255*a|0},${255*a|0},${255*a|0})`;gm.fillRect(tx+x*sx,ty+TS-(y+h)*sy,w*sx,h*sy);};
    const N_=(n,col,sz=2)=>{for(let k=0;k<n;k++){g.fillStyle=col(r());g.fillRect(tx+r()*TS,ty+r()*TS,sz*(.5+r()),sz*(.5+r()));}};
    return {tx,ty,mw,mh,sx,sy,R:R_,G:G_,N:N_};}
  const glass=(t,x,y,w,h,frame='#b9bab6',dark=[62,72,82],a=1)=>{t.R(x-.05,y-.05,w+.1,h+.1,frame);
    const gr=g.createLinearGradient(0,t.ty+TS-(y+h)*t.sy,0,t.ty+TS-y*t.sy);gr.addColorStop(0,rgb(dark[0]+18,dark[1]+22,dark[2]+28));gr.addColorStop(1,rgb(...dark));g.fillStyle=gr;
    g.fillRect(t.tx+x*t.sx,t.ty+TS-(y+h)*t.sy,w*t.sx,h*t.sy);t.G(x,y,w,h,a);};
  T(0,t=>{ // machiya ground floor: koshi lattice + ichimonji eave
    t.R(0,0,t.mw,t.mh,'#2a1d15');
    t.R(0,0,t.mw,.25,'#6d6a64');                                // stone footing
    for(let x=0;x<t.mw;x+=.075)t.R(x,.25,.03,2.05,rgb(84+r()*14,58+r()*10,40+r()*8));
    t.R(0,2.25,t.mw,.06,'#3a2a1e');t.R(0,.25,t.mw,.06,'#3a2a1e');
    t.R(0,.25,.14,2.1,'#4e3626');t.R(t.mw-.14,.25,.14,2.1,'#4e3626');t.R(t.mw*.62,.25,.1,2.1,'#4e3626');
    t.R(0,2.35,t.mw,.65,'#4a4b4f');for(let x=0;x<t.mw;x+=.16)t.R(x,2.35,.05,.65,'#35363a');t.R(0,2.35,t.mw,.07,'#2a2b2e'); // little tiled eave
  });
  T(15,t=>{ // machiya upper floor: cream plaster with mushiko-mado slits
    t.R(0,0,t.mw,t.mh,rgb(206,196,176));t.N(900,v=>rgb(190+v*30,182+v*28,165+v*25,.35),3);
    t.R(.8,.7,2.0,1.0,'#3b2a1e');for(let x=.85;x<2.8;x+=.16)t.R(x,.75,.08,.9,rgb(212,202,182));
    t.R(0,0,.12,t.mh,'#4e3626');t.R(t.mw-.12,0,.12,t.mh,'#4e3626');t.R(0,t.mh-.12,t.mw,.12,'#4e3626');
  });
  T(1,t=>{ // modern house: siding
    t.R(0,0,t.mw,t.mh,rgb(190,181,164));for(let y=0;y<t.mh;y+=.2)t.R(0,y,t.mw,.02,rgb(160,152,138));
    t.N(500,v=>rgb(170+v*40,162+v*36,148+v*30,.25),2);
    glass(t,1.2,.95,1.6,1.15,'#aeb0ad');t.R(1.1,.85,1.8,.08,'#8f908d');
    t.R(0,0,t.mw,.08,'#7d7a74');
  });
  T(2,t=>{ // modern house 2: light mortar, small window + vent
    t.R(0,0,t.mw,t.mh,rgb(210,206,198));t.N(1500,v=>rgb(190+v*40,186+v*40,178+v*40,.3),2);
    glass(t,.6,1.0,1.2,1.0,'#9c9d9a');t.R(.55,2.02,1.3,.15,'#7c7c7a');
    glass(t,2.6,1.3,.6,.6,'#9c9d9a',[60,66,70]);
    t.R(0,t.mh-.1,t.mw,.1,'#9a9890');
  });
  T(3,t=>{ // apartment: balcony + sliding doors
    t.R(0,0,t.mw,t.mh,rgb(226,223,215));
    glass(t,.5,.15,2.4,2.05,'#b8bab8',[44,52,60]);t.R(1.68,.15,.06,2.05,'#b8bab8');
    t.R(0,0,t.mw,.18,rgb(186,184,178));                                // slab edge
    t.R(0,.18,t.mw,1.0,rgb(205,203,196));t.G(0,.18,t.mw,1.0,0);       // solid balcony parapet
    t.R(0,1.12,t.mw,.06,'#9b9c99');
    for(let x=0;x<t.mw;x+=.4)t.R(x,.18,.015,1.0,'rgba(150,150,146,.5)');
    t.R(3.0,.2,.45,.9,rgb(170,172,170));                                // aircon unit
    t.R(t.mw-.08,0,.08,t.mh,rgb(180,178,170));
  });
  T(4,t=>{ // office glass grid
    t.R(0,0,t.mw,t.mh,'#6f7479');
    glass(t,.08,.9,t.mw-.16,2.8,'#80868c',[48,62,78]);for(let x=.8;x<t.mw;x+=.8)t.R(x-.03,.9,.06,2.8,'#80868c');
    t.R(0,0,t.mw,.9,'#5b6066');t.G(0,0,t.mw,.9,.35);
  });
  T(5,t=>{ // office tile + strip windows
    t.R(0,0,t.mw,t.mh,rgb(186,172,150));for(let y=0;y<t.mh;y+=.12)t.R(0,y,t.mw,.012,rgb(160,148,128));for(let x=0;x<t.mw;x+=.24)t.R(x,0,.012,t.mh,rgb(165,152,132));
    t.N(600,v=>rgb(170+v*40,158+v*36,138+v*30,.4),2);
    glass(t,0,1.0,t.mw,1.5,'#909290',[42,50,58]);for(let x=0;x<t.mw;x+=1.07)t.R(x,1.0,.05,1.5,'#909290');
  });
  T(6,t=>{ // plain concrete
    t.R(0,0,t.mw,t.mh,rgb(168,166,160));t.N(2500,v=>rgb(140+v*60,138+v*60,132+v*60,.25),3);
    for(let k=0;k<14;k++){const x=r()*t.mw;g.fillStyle='rgba(80,78,72,.10)';g.fillRect(t.tx+x*t.sx,t.ty,(4+r()*10),TS);}
    glass(t,1.6,1.4,.8,.8,'#8c8c88',[58,62,64]);t.R(0,t.mh-.05,t.mw,.05,'rgba(90,90,86,.6)');
  });
  T(7,t=>{ // castle/temple white plaster with dark posts (shikkui)
    t.R(0,0,t.mw,t.mh,rgb(236,235,230));t.N(1200,v=>rgb(220+v*35,220+v*35,214+v*35,.35),3);
    t.R(0,0,t.mw,.45,'#3a2c22');for(let x=0;x<t.mw;x+=.3)t.R(x,0,.02,.45,'#2a1f18');    // dark wooden skirt (shitami)
    t.R(0,0,.16,t.mh,'#4a382a');t.R(0,2.9,t.mw,.14,'#4a382a');
  });
  T(8,t=>{ // kawara roof (u along eaves, v up the slope)
    t.R(0,0,t.mw,t.mh,rgb(70,72,78));
    for(let x=0;x<t.mw;x+=.3){const v=r()*10;t.R(x,0,.13,t.mh,rgb(96+v,99+v,106+v));t.R(x+.13,0,.03,t.mh,rgb(118,121,128));t.R(x-.03,0,.03,t.mh,rgb(48,50,55));}
    for(let y=0;y<t.mh;y+=.3)t.R(0,y,t.mw,.035,'rgba(30,31,35,.55)');
  });
  T(9,t=>{ // flat roof: membrane/concrete with seams and stains

  toggleStyle,setStyleInstant,startFly,stopFly,U:post.uniforms,WU:waterU,SKY:skyU,REAL,sun,scene,OUT,renderer,STATS,castleNamed,camera,controls,
  get flyT(){return flyT;}, set flyT(v){flyT=v;},
  step(dt){update(dt);render();},
  advance(dt){update(dt);},
  setView(p,t){camera.position.set(...p);controls.target.set(...t);controls.update();},
  home(){camera.position.copy(HOME_POS);controls.target.copy(HOME_TGT);controls.update();},
  setProg(p){prog=p;target=p>=.5?1:0;},
  setReal(o){Object.assign(REAL,o);curStyle=-1;},
  grab(q=.92){return renderer.domElement.toDataURL(q>=1?'image/png':'image/jpeg',q);},
  get flying(){return flying;}};

const loading=document.getElementById('loading');
let last=performance.now(),first=true;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();if(first){first=false;loading.style.opacity=0;setTimeout(()=>loading.remove(),700);}requestAnimationFrame(loop);}
document.getElementById('attr').innerHTML=ATTR_HTML;
if(CAPTURE){update(0);render();loading.remove();window.APP.ready=true;}else requestAnimationFrame(loop);
</script>
</body>
</html>
